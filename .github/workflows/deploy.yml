
name: Build and deploy Pose Studio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -q PoseStudio-camera-scroll-fixed.zip -d extracted

      - name: Install dependencies
        working-directory: extracted/pose-reference-studio
        run: npm install

      - name: Build project
        working-directory: extracted/pose-reference-studio
        run: npm run build

      - name: Deploy to Cloudflare
        working-directory: extracted/pose-reference-studio
        run: npx wrangler@latest pages deploy dist --project-name=pose-reference-studio --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          
